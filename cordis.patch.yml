# DeepSeek Harness profile bundle. The runtime joins the host Agent lifecycle;
# it does not start a process, model client, or standalone web server.
- insert:
    - id: context-graph
      name: dsh-context-graph
      config:
        tokenBudget: 6000
        requestTokenBudget: 300000
        outputReserveTokens: 256000
        tokenSafetyRatio: 1.15
        allowedInstructionPlugins: []
        autoScan: true
        autoInject: true
        firewallMode: enforce
        webUi: true
